<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearsay</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body data-state="starting">
  <header class="top">
    <span class="status"><i class="dot" aria-hidden="true"></i><span id="statusText">Starting</span></span>
    <span class="ctx" id="ctx" hidden><img id="ctxIcon" src="../../icons/icon-16.png" alt="" width="14" height="14" hidden><span id="ctxText"></span></span>
  </header>

  <main>
    <p class="sr-only" id="announce" role="status" aria-live="polite"></p>
    <section class="hero" id="hero">
      <div class="orb" id="orb" aria-hidden="true">
        <span class="ring ring-outer"></span>
        <span class="ring ring-inner"></span>
        <span class="core">
          <svg class="icon-mic" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <svg class="icon-off" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>
        </span>
      </div>
      <h1 class="title" id="title"></h1>
      <p class="line" id="detail"></p>
      <ol class="opts" id="options" hidden></ol>
      <button class="ghost-btn" id="heroAction" type="button" hidden></button>
    </section>

    <section class="lower" id="lower"></section>
  </main>

  <footer class="foot">
    <button class="btn" id="toggle" type="button"><span id="toggleText">Pause</span> <kbd id="toggleKey">Alt Shift V</kbd></button>
    <button class="icon-btn" id="settings" type="button" aria-label="Settings" title="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    </button>
  </footer>
</body>
</html>
